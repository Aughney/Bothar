name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships with npm 11 natively, matching local development.
          # Avoids the npm-10 self-upgrade bug ("Cannot find module
          # 'promise-retry'") and the stricter lockfile resolution that
          # demands optional/peer entries npm 11 leaves implicit.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
