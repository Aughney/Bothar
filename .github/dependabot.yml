version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stay on @privy-io/react-auth v2 — major upgrades require config + integration
      # changes; revisit once we have time to validate the upgrade path.
      - dependency-name: "@privy-io/react-auth"
        update-types:
          - "version-update:semver-major"
