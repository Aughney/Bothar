version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # v3 requires config changes + Turbopack incompatibility - stay on v2 until resolved
    ignore:
      - dependency-name: "@privy-io/react-auth"
        update-types:
          - "version-update:semver-major"
